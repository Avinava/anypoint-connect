name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22, 24, 26]

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test

            - name: Lint (type check)
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Audit production dependencies
              run: npm run audit:prod

            - name: CLI smoke tests
              run: |
                  node dist/cli.js --help
                  node dist/cli.js config --help
                  node dist/cli.js auth --help
                  node dist/cli.js apps --help
                  node dist/cli.js deploy --help
                  node dist/cli.js logs --help
                  node dist/cli.js monitor --help
                  node dist/cli.js exchange --help
                  node dist/cli.js api --help
                  node dist/cli.js dc --help

            - name: MCP server startup check
              run: |
                  # Verify MCP server loads without crashing (will fail on missing config, but should import cleanly)
                  node -e "import('./dist/mcp.js').catch(() => process.exit(0))" || true

    docs:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements-docs.txt

            - name: Setup Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Check documentation and examples
              run: npm run docs:check

            - name: Build the documentation site
              # --strict turns a broken cross-link, missing anchor, or page left out
              # of the nav into a failure here rather than a warning in the deploy run.
              run: |
                  pip install -r requirements-docs.txt
                  mkdocs build --strict
