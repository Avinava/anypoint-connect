name: Release & Publish

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test

            - name: Run static and documentation checks
              run: |
                  npm run lint
                  npm run format:check
                  npm run docs:check

            - name: Audit production dependencies
              run: npm run audit:prod

            - name: Get version from tag
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Verify package version matches tag
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
                    echo "❌ package.json version ($PKG_VERSION) doesn't match tag (v${{ steps.version.outputs.VERSION }})"
                    exit 1
                  fi
                  echo "✅ Version verified: $PKG_VERSION"

            - name: Publish to npm
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  body: |
                      ## Install
                      ```bash
                      npm install -g @sfdxy/anypoint-connect@${{ steps.version.outputs.VERSION }}
                      ```

                      ## Quick Start
                      ```bash
                      # Setup
                      anc config init
                      anc auth login

                      # Use
                      anc apps list --env Sandbox
                      anc dc list
                      anc logs tail sample-orders-api --env Development
                      ```

                      See [README.md](https://github.com/Avinava/anypoint-connect/blob/main/README.md) for full documentation.
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify the mule-skills compatibility hub
              continue-on-error: true
              env:
                  DISPATCH_TOKEN: ${{ secrets.MULE_SKILLS_DISPATCH_TOKEN }}
                  VERSION: ${{ steps.version.outputs.VERSION }}
              run: |
                  if [ -z "$DISPATCH_TOKEN" ]; then
                    echo "::warning::MULE_SKILLS_DISPATCH_TOKEN is not configured; run the mule-skills update workflow manually."
                    exit 0
                  fi
                  payload=$(jq -n \
                    --arg package "anypoint-connect" \
                    --arg version "$VERSION" \
                    --arg repository "$GITHUB_REPOSITORY" \
                    --arg tag "$GITHUB_REF_NAME" \
                    '{event_type:"tool_release",client_payload:{package:$package,version:$version,repository:$repository,tag:$tag}}')
                  curl --fail-with-body --silent --show-error \
                    --request POST \
                    --header "Accept: application/vnd.github+json" \
                    --header "Authorization: Bearer $DISPATCH_TOKEN" \
                    --header "X-GitHub-Api-Version: 2026-03-10" \
                    https://api.github.com/repos/Avinava/mule-skills/dispatches \
                    --data "$payload"
